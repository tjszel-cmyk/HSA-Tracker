<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Expense History</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .button-row {
            margin-bottom: 20px;
        }

        button {
            padding: 10px 15px;
            margin-right: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Expense History</h1>

    <div class="button-row">
        <button onclick="window.location.href='index.html'">Return to Entry Form</button>
        <button onclick="window.print()">Print</button>
    </div>

    <table id="history-table">
        <thead>
            <tr>
                <th>Date</th>
                <th>Name</th>
                <th>Amount</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data will be inserted here -->
        </tbody>
    </table>

    <script>
        // 🔧 Replace with your actual Web App URL
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby3-RxnANNqECiBiEbPv0HgiK5fS6286GjcsVTgHU5WfOggH0L_ktCvlyoVM7Tv7c60/exec";

        async function loadHistory() {
            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.json();

                // Sort newest first
                data.sort((a, b) => new Date(b.date) - new Date(a.date));

                const tableBody = document.querySelector("#history-table tbody");
                tableBody.innerHTML = "";

                data.forEach(entry => {
                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${entry.date}</td>
                        <td>${entry.name}</td>
                        <td>${entry.amount}</td>
                        <td>${entry.description}</td>
                    `;

                    tableBody.appendChild(row);
                });

            } catch (error) {
                console.error("Error loading history:", error);
                alert("Unable to load history.");
            }
        }

        loadHistory();
    </script>

</body>
</html>
