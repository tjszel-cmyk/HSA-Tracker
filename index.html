<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>HSA Expense Entry</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        form {
            max-width: 400px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Enter HSA Expense</h1>

    <form id="expense-form">
        <label for="date">Date</label>
        <input type="date" id="date" required>

        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Provider or Store" required>

        <label for="amount">Amount</label>
        <input type="number" id="amount" step="0.01" required>

        <label for="description">Description</label>
        <textarea id="description" rows="3" placeholder="What was this expense for?" required></textarea>

        <button type="submit">Save Expense</button>
    </form>

    <button onclick="window.location.href='history.html'" style="margin-top:20px;">
        View History
    </button>

    <!-- Load your JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
